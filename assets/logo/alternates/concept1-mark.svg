<svg xmlns="http://www.w3.org/2000/svg" viewBox="-50 -50 100 100">
  <title>Hindcast — Archive Reel (mark)</title>
  <!-- Single-color mark. Brass adapts to ground: #8F7132 on paper, #C9A96A on dark.
